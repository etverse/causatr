# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [main, master]
    paths-ignore:
      - "altdoc/**"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "altdoc/**"
      - "docs/**"
  # Weekly full-matrix safety net so the cross-platform / oldrel configs that
  # PRs skip are still exercised regularly.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  # Pull requests run a single, fast Linux config for quick feedback; the full
  # suite still runs on every PR (no tests are skipped), just on one OS. The
  # full three-config matrix (macOS + ubuntu release + ubuntu oldrel) runs on
  # push to the default branch, on the weekly cron, and on manual dispatch.
  # The package is pure R (no compiled code), so cross-platform divergence is
  # low-risk and verifying it at merge cadence rather than per-PR-push is a
  # sound trade.
  matrix-setup:
    runs-on: ubuntu-latest
    outputs:
      configs: ${{ steps.set.outputs.configs }}
    steps:
      - id: set
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo 'configs=[{"os":"ubuntu-latest","r":"release"}]' >> "$GITHUB_OUTPUT"
          else
            echo 'configs=[{"os":"macos-latest","r":"release"},{"os":"ubuntu-latest","r":"release"},{"os":"ubuntu-latest","r":"oldrel-1"}]' >> "$GITHUB_OUTPUT"
          fi

  R-CMD-check:
    needs: matrix-setup
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON(needs.matrix-setup.outputs.configs) }}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
        if: runner.os != 'Windows'
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::mice
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
        if: runner.os != 'Windows'
      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--no-build-vignettes")'
          args: 'c("--no-manual", "--as-cran", "--no-vignettes")'
          error-on: '"error"'
        if: runner.os == 'Windows'
