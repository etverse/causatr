on:
  push:
    branches: [main, master]
    paths-ignore:
      - "altdoc/**"
      - "docs/**"
  pull_request:
    branches: [main, master]
    paths-ignore:
      - "altdoc/**"
      - "docs/**"

name: format-check

jobs:
  air:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: posit-dev/setup-air@v1
      - run: air format . --check
